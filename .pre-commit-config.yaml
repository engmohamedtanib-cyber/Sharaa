# Pre-commit hooks (BUILD_SPEC Phase 0). Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format-check
        name: ruff (format check)
        entry: ruff format --check
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy-strict
        name: mypy --strict (engine + validation)
        entry: mypy src/engine src/validation
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
        types: [python]
