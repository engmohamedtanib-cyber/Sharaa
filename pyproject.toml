[project]
name = "egx-shariah-engine"
version = "0.1.0"
description = "Autonomous EGX Shariah-compliance screening, scoring and decision engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# Layers that touch external services. The deterministic core
# (engine/ + validation/) never imports these.
ingestion = [
    "anthropic>=0.40.0",
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.0",
    "pillow>=11.0.0",
    "pytesseract>=0.3.13",
    "httpx>=0.28.0",
]
db = [
    "psycopg[binary]>=3.2.0",
    "supabase>=2.10.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.120.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
egx = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/research",
    "src/ingestion",
    "src/validation",
    "src/engine",
    "src/reporting",
    "src/db",
]
force-include = { "src/cli.py" = "cli.py" }

# ----------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "N",             # pep8-naming
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests: allow non-PEP8 fixture/local names and wide parametrize tables.
"tests/**" = ["N802", "N806", "E501"]

# ----------------------------------------------------------------------
# Mypy — strict on the deterministic layers (CLAUDE.md §5)
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["engine.*", "validation.*"]
strict = true

[[tool.mypy.overrides]]
# Optional external deps are not installed in the core test environment.
module = [
    "anthropic.*", "pdfplumber.*", "pytesseract.*", "pypdf.*",
    "supabase.*", "psycopg.*", "PIL.*", "httpx.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["engine", "validation"]

[tool.coverage.report]
show_missing = true
