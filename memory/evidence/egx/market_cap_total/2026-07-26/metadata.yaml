notes: >
  4 486 daily rows. Columns are exactly two: "Trade Date" and
  "Market Cap. Total". THERE IS NO COMPANY COLUMN, because there is no
  company — this is the aggregate capitalisation of the entire Egyptian
  Exchange.

  WHY IT IS RECORDED RATHER THAN DISCARDED: it was uploaded in answer to a
  request for Telecom Egypt's market cap history, and it is the wrong series
  in a way that is invisible unless the magnitude is checked. Keeping it,
  labelled, is a permanent guard rail against the same mistake. Deleting it
  would only mean someone downloads it again and reaches for it again.

  THE NEAR MISS, WITH NUMBERS. On 2026-07-22 this file reads
  3 951 140 876 406. Telecom Egypt on the same day is 1 707 071 600 shares
  (note 26 of its Q1-2026 filing) at 103.28 = 176 306 354 848. The file is
  22.4x the company. Screen C is interest-bearing debt over that denominator,
  capped at 30%:

    against the market total  : 76.11bn / 3 015bn avg = 2.5%  -> GREEN, huge headroom
    against the company       : 76.11bn / 176.3bn     = 43%   -> breach

  The wrong denominator does not produce a slightly wrong answer. It converts
  a breach into a comfortable pass, which is the precise failure the Prime
  Directive names. (Neither figure is a verdict: the convention requires a
  trailing 12-month average, and 103.28 is a spot price from an unverified
  paste.)

  WHAT IS ACTUALLY NEEDED for Screens C/D/E: per-company market cap, or a
  price series to multiply by shares outstanding. On the EGX site that is
  Historical Statistics -> Stocks Data with the company selected, not
  Market Cap. Data.

  WHAT THIS IS LEGITIMATELY GOOD FOR: market-level context — breadth, an
  equity-risk-premium input, or a sanity check that a company's capitalisation
  is a plausible fraction of the exchange. No consumer today, hence
  `used_by: []`.
