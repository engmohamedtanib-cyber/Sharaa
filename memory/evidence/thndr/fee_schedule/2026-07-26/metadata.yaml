notes: >
  WEAKER PROVENANCE THAN A FILE. This is a transcription pasted into a chat,
  not a downloaded document, so the bytes attest to what was pasted and not to
  what the page served. It is admitted anyway, deliberately: ENGINE_SPEC §7.3
  requires fees be verified against Thndr's published schedule before any live
  run and forbids shipping guessed values, and the account holder reading their
  own broker's published page is the best source available while egress is
  blocked. It is also self-checking in a way a recalled figure never is — the
  page carries its own worked example, and the engine reproduces it to the
  piastre in tests/test_engine_portfolio.py.

  WHY IT MATTERS BEYOND FILLING IN FOUR NUMBERS: the real schedule is
  fixed-plus-percentage (2 EGP + 0.1%), a shape the engine's cost model could
  not represent. The old model would have understated the cost of small trades
  — the direction that lets the system recommend an economically destructive
  trade. See decisions/0007.

  A WebSearch snippet consulted before this arrived claimed the EGX fee was
  "0.12 per thousand" (0.012%). The real figure is 0.01%. The snippet was
  wrong, and it was never stored — which is the discipline working.

  NOT MODELLED (deliberate, each recorded here so it is a known gap, not an
  oversight):
    * FRA fee is per TRANSACTION, not per order. One order can fill across
      several counterparties and incur the 1 EGP minimum several times. The
      engine assumes one transaction per order, so it UNDERSTATES cost for
      orders that fill in fragments.
    * Caps (5,000 EGP on EGX/MCDR/risk insurance, 250 EGP on FRA) are not
      modelled. They only bind above roughly 50 million EGP of order value,
      far beyond any position this portfolio will hold.
    * MCDR annual custody fee (0.01% of portfolio value each 31 December) is a
      holding cost, not a trade cost, and has no home in the engine yet.
    * Thndr Trader subscription waives 50 commission orders a month. Not
      modelled: the unsubscribed case is the conservative one.
