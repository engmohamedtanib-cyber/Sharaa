# ---------------------------------------------------------------------
# EXPECTED SCREENING OUTCOME
# ---------------------------------------------------------------------
expected_screening:
  status: DATA_INSUFFICIENT
  breach_type: TYPE_4_DATA
  blocking_reasons:
    - screen: B
      reason: >
        Interest income is not separately disclosed anywhere in the document
        (see line_items.interest_income). The numerator cannot be formed.
    - screens: [C, D, E]
      reason: >
        The denominator is mcap_avg_12m (config/thresholds.yaml
        denominator_convention). A trailing 12-month average market
        capitalisation is not in any filing and no market-data source exists
        yet. Shares outstanding are known; the price history is not.
  computable_today: [A]
  notes: >
    Screen A has no non-permissible revenue visible: Note 3-1 disaggregates
    all 28 210 642 across five telecom business units. That is consistent
    with a pass, but absence of a disclosed line is not evidence of zero, and
    a single passing screen cannot lift a DATA_INSUFFICIENT verdict anyway —
    the gate requires all five (R7).

    THIS OUTCOME IS THE CORRECT ONE, not a failure of the exercise. A
    condensed interim with a narrative finance-cost note genuinely does not
    contain what the gate needs. The right next document is the most recent
    AUDITED ANNUAL report, whose notes are not condensed.
