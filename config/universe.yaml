# =====================================================================
# config/universe.yaml
# ---------------------------------------------------------------------
# The investable universe (decisions/0004).
#
# PRIMARY UNIVERSE: the EGX 33 Shariah Index constituents.
#
# The index is maintained by the Egyptian Exchange with an independent
# Shariah Supervisory Board. Constituents are drawn from EGX100, must
# have a Shariah supervisory board, and must meet the board's activity,
# financial-ratio and liquidity criteria. Single-stock weight is capped
# at 15%. Launched June 2024; base date 2022-01-01.
#
# OUR ENGINE DOES NOT DEFER TO THE INDEX. Membership selects the
# universe; our Screens A-E then independently verify each holding and
# measure HEADROOM, which the index never reports. Index membership is a
# periodic, lagging signal - a company can breach between rebalances,
# and Screen B's early warning (interest income crossing 3% of revenue)
# is designed to catch exactly that drift.
#
# DO NOT HAND-EDIT THE CONSTITUENT LIST. It is generated by
# `research/transcribers/transcribe_index.py` from the evidence record
# named in `retrieved` below. At the next rebalance, admit the new export
# as evidence and re-run the transcriber - the full procedure is in
# `checklists/INDEX_REBALANCE.md`. See decisions/0005.
# =====================================================================

version: "1.0.0"
status: "POPULATED"

index:
  name: "EGX 33 Shariah Index"
  code: "EGX33-SHARIAH"
  operator: "The Egyptian Exchange"
  launched: "2024-06"
  base_date: "2022-01-01"
  # 33 ISSUERS. The list below holds 34 LISTINGS, because Faisal Islamic
  # Bank of Egypt is listed twice - once in EGP (FAIT) and once in USD
  # (FAITA). `engine/universe.py` checks this count against distinct
  # issuer_id values, not row count, and refuses to load if they diverge.
  constituent_count: 33
  max_single_weight: 0.15
  sources:
    - "https://www.egx.com.eg/en/currentindexconstituntes.aspx?type=22&nav=22"
    - "https://english.mubasher.info/markets/EGX/indices/SHARIAH"
    - "https://www.investing.com/indices/egx-33-shariah-compliant-index-components"

# ---------------------------------------------------------------------
# PROVENANCE (CLAUDE.md R1)
#
# Transcribed from a workbook the user uploaded into the session. The
# file carries the column layout of the Egyptian Exchange constituents
# export (SYMBOL_CODE / SYMB_NAME_ARB / SYMB_NAME_ENG / REUTERS_CODE /
# "Weight as of DD/MM/YYYY") with Egyptian ISINs and Reuters RICs.
#
# The bytes are registered as evidence. `evidence_id` resolves through
# store/evidence.py, which recomputes the digest from the file on disk -
# so the hash below is checked against reality on every test run rather
# than merely recorded here (memory/evidence/README.md).
#
# Recorded honestly: this session did NOT fetch egx.com.eg and cannot
# attest to the URL the file came from - network egress is blocked here
# (decisions/0004). What is attested is the exact byte content, by hash.
# ---------------------------------------------------------------------
retrieved:
  at: "2026-07-25"
  evidence_id: "egx/shariah_index/2026-04-30"
  from: "memory/evidence/egx/shariah_index/2026-04-30/constituents.xlsx (uploaded by the user as EGX33ShariahIndexMay2026.xlsx; origin URL not independently verified)"
  by: "user upload -> research/transcribers/transcribe_index.py"
  sha256: "1ad43debdb1e626650837ac58a483f81bdccbad52b4ab04a75102c6d14b7470c"
  weights_as_of: "2026-04-30"

# ---------------------------------------------------------------------
# CONSTITUENTS - generated, do not hand-edit.
#
# `sector` is null for every row and that is deliberate. The source
# export carries no sector column. Filling it from recall would put an
# unsourced fact into the one file whose entire purpose is to hold only
# sourced ones (CLAUDE.md R3). It stays null until a primary source for
# sector classification is opened.
#
# `index_weight` is the published weight at `retrieved.weights_as_of`,
# quantised to 8dp to absorb Excel float noise (an exact 15.00% cap
# arrives as 0.1500000000000203). It is INFORMATIONAL ONLY and is never
# an engine input: engine/portfolio.py derives target weights from
# scores and constraints, not from the index.
# ---------------------------------------------------------------------
